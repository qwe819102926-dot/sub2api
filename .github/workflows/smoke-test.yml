name: Smoke test and dev image

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: sub2api:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke tests
        run: sh deploy/smoke-test.sh sub2api:smoke 8080

      - name: Push dev image
        run: |
          SHA="${GITHUB_SHA::7}"
          docker tag sub2api:smoke ghcr.io/qwe819102926-dot/sub2api:dev
          docker tag sub2api:smoke ghcr.io/qwe819102926-dot/sub2api:dev-${SHA}
          docker push --all-tags ghcr.io/qwe819102926-dot/sub2api
