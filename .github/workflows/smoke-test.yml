name: Build and smoke-test dev image

on:
  push:
    branches: [dev]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - 'docs/legal/**'
      - 'deploy/smoke-test.sh'
      - 'deploy/docker-entrypoint.sh'
      - '.github/workflows/publish-image.yml'
      - '.github/workflows/smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: ghcr.io/qwe819102926-dot/sub2api

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the immutable candidate first so the smoke test runs the exact
      # registry artifact that can later be promoted. A failed candidate is
      # never tagged as dev or production.
      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            COMMIT=${{ github.sha }}
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=sub2api-linux-amd64
          cache-to: type=gha,scope=sub2api-linux-amd64,mode=max

      - name: Run smoke tests
        run: sh deploy/smoke-test.sh "${IMAGE_NAME}@${{ steps.build.outputs.digest }}" 8080

      - name: Save tested image digest
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "${CANDIDATE_DIGEST}" > tested-image-digest.txt

      - name: Upload tested image digest
        uses: actions/upload-artifact@v4
        with:
          name: tested-image-${{ github.sha }}
          path: tested-image-digest.txt
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Promote tested candidate to dev tags
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          SHA="${GITHUB_SHA::7}"
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${IMAGE_NAME}:dev" \
            --tag "${IMAGE_NAME}:dev-${SHA}" \
            "${IMAGE_NAME}@${CANDIDATE_DIGEST}"

      - name: Record tested image
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          SHA="${GITHUB_SHA::7}"
          {
            echo "### Tested dev image"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Digest: \`${CANDIDATE_DIGEST}\`"
            echo "- Tag: \`${IMAGE_NAME}:dev-${SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
