name: Smoke test and dev image

on:
  push:
    branches: [dev]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - 'docs/legal/**'
      - 'deploy/smoke-test.sh'
      - 'deploy/docker-entrypoint.sh'
      - '.github/workflows/smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Use the persistent builder so Docker/Go/pnpm caches survive runs.
    # Only trusted commits that have landed on dev use this runner.
    runs-on: [self-hosted, linux, x64, sub2api-builder]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: sub2api-builder
          cleanup: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: sub2api:smoke
          # Keep a separate registry cache from the production workflow while
          # retaining intermediate frontend and Go builder layers locally.
          cache-from: type=registry,ref=ghcr.io/qwe819102926-dot/sub2api:buildcache-dev
          cache-to: type=registry,ref=ghcr.io/qwe819102926-dot/sub2api:buildcache-dev,mode=max
          build-args: |
            NPM_CONFIG_REGISTRY=https://registry.npmmirror.com

      - name: Run smoke tests
        run: sh deploy/smoke-test.sh sub2api:smoke 8080

      - name: Push dev image
        run: |
          SHA="${GITHUB_SHA::7}"
          docker tag sub2api:smoke ghcr.io/qwe819102926-dot/sub2api:dev
          docker tag sub2api:smoke ghcr.io/qwe819102926-dot/sub2api:dev-${SHA}
          docker push ghcr.io/qwe819102926-dot/sub2api:dev
          docker push ghcr.io/qwe819102926-dot/sub2api:dev-${SHA}
