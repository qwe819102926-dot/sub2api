name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build once, test the loaded image, then push that exact image. This avoids
  # rebuilding the same Dockerfile in a second runner after the smoke gate.
  build-smoke-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/qwe819102926-dot/sub2api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build image once (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            sub2api:smoke
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish-main
          cache-to: type=gha,mode=max,scope=publish-main

      - name: Run smoke tests
        run: sh deploy/smoke-test.sh sub2api:smoke 8080

      - name: Push tested image
        run: docker push --all-tags ghcr.io/qwe819102926-dot/sub2api
